<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Командный проект: Герои комиксов</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e1b4b);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }
        header {
            text-align: center;
            margin-bottom: 40px;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p {
            color: #94a3b8;
            font-size: 1.1rem;
        }
        .container {
            display: flex;
            gap: 30px;
            max-width: 800px;
            width: 100%;
            justify-content: center;
            flex-wrap: wrap;
        }
        .card {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 30px;
            width: 320px;
            text-align: center;
            backdrop-filter: blur(10px);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 10px 30px rgba(56, 189, 248, 0.2);
            border-color: rgba(56, 189, 248, 0.4);
        }
        .card h2 {
            font-size: 1.5rem;
            margin-bottom: 15px;
            color: #e2e8f0;
        }
        .card p {
            font-size: 0.95rem;
            margin-bottom: 25px;
        }
        .btn {
            display: inline-block;
            background: linear-gradient(90deg, #0284c7, #4f46e5);
            color: white;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            transition: opacity 0.2s ease;
        }
        .btn:hover {
            opacity: 0.9;
        }
        footer {
            margin-top: auto;
            color: #64748b;
            font-size: 0.9rem;
            padding-top: 20px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Галерея Героев Комиксов</h1>
        <p>Совместный командный проект участников</p>
    </header>

    <div class="container">
        <!-- Карточка Ерасыла -->
        <div class="card">
            <h2>Герой Ерасыла</h2>
            <p>Персонаж, добавленный создателем проекта. Узнайте его историю и особенности.</p>
            <!-- Замените имя файла на свое, если оно отличается -->
            <a href="yerkimbek-favorite-hero.html" class="btn">Открыть страницу</a>
        </div>

        <!-- Карточка Максата -->
        <div class="card">
            <h2>Герой Максата</h2>
            <p>Персонаж, добавленный вторым участником команды.</p>
            <!-- Ссылка на файл Максата из прошлой лабораторной -->
            <a href="maksat-favorite-hero.html" class="btn">Открыть страницу</a>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 | GitHub Team Project</p>
    </footer>

</body>
</html>
